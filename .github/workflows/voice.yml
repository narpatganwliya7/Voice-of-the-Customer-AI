name: Video narration

# Generates the launch video's narration with Kokoro, a free open-source TTS model.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Kokoro voice for the full narration (e.g. am_michael, bm_george)"
        default: ""
      samples:
        description: "Instead of the narration, one short sample per voice (separate voices with ;)"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.*" kokoro soundfile numpy pandas
      - run: bash scripts/databranch.sh open
      - name: Generate
        env:
          VOICE: ${{ inputs.voice }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          if [ -n "$SAMPLES" ]; then
            python video/tts.py --samples "$SAMPLES" --out store/video/samples
          else
            python video/tts.py --out store/video/voice ${VOICE:+--voice "$VOICE"}
          fi
      - name: Save to the data branch
        run: |
          bash scripts/databranch.sh save "data: video narration (run ${{ github.run_id }})"
