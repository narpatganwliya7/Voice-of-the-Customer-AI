name: Video narration

# Generates the launch video's narration with Kokoro, a free open-source TTS model.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Kokoro voice (e.g. af_heart, am_michael, bf_emma, bm_george)"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.*" kokoro soundfile numpy pandas
      - run: bash scripts/databranch.sh open
      - run: python video/tts.py --out store/video/voice ${{ inputs.voice && format('--voice {0}', inputs.voice) || '' }}
      - run: bash scripts/databranch.sh save "data: video narration (run ${{ github.run_id }})"
