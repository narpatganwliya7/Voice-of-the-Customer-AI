name: Video narration

# Generates the launch video's narration.
#   elevenlabs: natural voices (incl. English with a French accent), free plan, key in ELEVENLABS_API_KEY
#   kokoro:     free open-source model, no account
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Voice engine"
        type: choice
        options: [elevenlabs, kokoro, align]
        default: elevenlabs
      voice:
        description: "Voice id for the full narration (ElevenLabs voice id, or a Kokoro voice like am_michael)"
        default: ""
      samples:
        description: "Instead of the narration: one short sample per voice (ids separated by ;), or 'all' for every voice you added"
        default: ""
      source:
        description: "align: a recording already on the private data store, cut into script lines"
        default: "video/narration_source.mp3"
      model:
        description: "ElevenLabs model id (default eleven_multilingual_v2)"
        default: "eleven_multilingual_v2"
      list:
        description: "Only list the voices in the ElevenLabs account"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

env:   # the private data store (see scripts/databranch.sh)
  DATA_REPO: ${{ vars.DATA_REPO }}
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install soundfile numpy requests
          if [ "${{ inputs.engine }}" = "align" ]; then pip install faster-whisper; fi
          if [ "${{ inputs.engine }}" = "kokoro" ]; then
            pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.*" kokoro pandas
          fi
      - run: bash scripts/databranch.sh open
      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENGINE: ${{ inputs.engine }}
          VOICE: ${{ inputs.voice }}
          SAMPLES: ${{ inputs.samples }}
          LIST: ${{ inputs.list }}
          MODEL: ${{ inputs.model || 'eleven_multilingual_v2' }}
        run: |
          if [ "$ENGINE" = "align" ]; then
            python video/align_voice.py "store/${{ inputs.source }}" --out store/video/voice
          elif [ "$LIST" = "true" ]; then
            python video/tts.py --engine "$ENGINE" --list
          elif [ -n "$SAMPLES" ]; then
            python video/tts.py --engine "$ENGINE" --model "$MODEL" --samples "$SAMPLES" --out store/video/samples
          else
            python video/tts.py --engine "$ENGINE" --model "$MODEL" --out store/video/voice ${VOICE:+--voice "$VOICE"}
          fi
      - name: Save to the private data store
        if: ${{ !inputs.list }}
        run: |
          bash scripts/databranch.sh save "data: video narration (run ${{ github.run_id }})"
