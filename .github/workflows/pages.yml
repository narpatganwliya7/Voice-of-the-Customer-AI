name: Publish website

# Publishes site/ (with its public data bundle, site/data/bundle.json) to GitHub Pages
# whenever the site changes on main. Pages needs a public repository (or a paid plan).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "assets/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site with the latest data
        run: |
          mkdir -p _site
          cp -r site/. _site/          # includes data/bundle.json: aggregates and short anonymous quotes only
          cp -r assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
