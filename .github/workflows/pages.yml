name: Publish website

# Publishes site/ with the latest data bundle to GitHub Pages after every analysis.
# Pages needs a public repository (or a paid plan); on a private repo this job is skipped.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Analyse (train, score, insights, AI analyst)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site with the latest data
        run: |
          git fetch --depth 1 origin data
          mkdir -p _site/data
          cp site/* _site/
          git show FETCH_HEAD:site/bundle.json > _site/data/bundle.json
          cp -r assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
