name: Collect reviews

# Live mode: uncomment `schedule` to capture new reviews every 10 minutes.
# Showcase mode (default): run on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = only new reviews · backfill = recent history"
        type: choice
        options: [incremental, backfill]
        default: incremental
      brands:
        description: "Comma-separated brands (e.g. 'Orange, SNCF Connect') or 'all'"
        default: all
      max_per_app:
        description: "Max Google Play reviews per app"
        default: "2000"
      since_days:
        description: "How many days back to go"
        default: "180"
      refresh_apps:
        description: "Re-check official app ids"
        type: boolean
        default: false
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: data-branch   # every workflow that writes the private data store shares this queue
  cancel-in-progress: false

env:   # the private data store (see scripts/databranch.sh)
  DATA_REPO: ${{ vars.DATA_REPO }}
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/databranch.sh open

      - name: Collect
        run: >
          python -m ecoute collect --store store
          --mode "${{ inputs.mode || 'incremental' }}"
          --brands "${{ inputs.brands || 'all' }}"
          --max-per-app "${{ inputs.max_per_app || '2000' }}"
          --since-days "${{ inputs.since_days || '180' }}"
          ${{ inputs.refresh_apps && '--refresh-apps' || '' }}

      - name: Save to the private data store
        run: |
          NEW=$(tail -n1 store/runs.jsonl | python -c "import json,sys;print(json.load(sys.stdin)['new_reviews'])")
          bash scripts/databranch.sh save "data: +$NEW reviews (run ${{ github.run_id }})"
