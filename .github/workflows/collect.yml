name: Collect reviews

# Live mode: uncomment `schedule` to capture new reviews every 10 minutes.
# Showcase mode (default): run on demand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental = only new reviews · backfill = recent history"
        type: choice
        options: [incremental, backfill]
        default: incremental
      brands:
        description: "Comma-separated brands (e.g. 'Orange, SNCF Connect') or 'all'"
        default: all
      max_per_app:
        description: "Max Google Play reviews per app"
        default: "2000"
      refresh_apps:
        description: "Re-check official app ids"
        type: boolean
        default: false
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Open the data branch
        run: |
          git config --global user.name  "ecoute-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data; then
            git worktree add store FETCH_HEAD
          else
            git worktree add --detach store
            git -C store rm -rq . && git -C store clean -fdq
          fi

      - name: Collect
        run: >
          python -m ecoute collect --store store
          --mode "${{ inputs.mode || 'incremental' }}"
          --brands "${{ inputs.brands || 'all' }}"
          --max-per-app "${{ inputs.max_per_app || '2000' }}"
          ${{ inputs.refresh_apps && '--refresh-apps' || '' }}

      - name: Save to the data branch
        # One squashed commit keeps the branch small; runs.jsonl keeps the full history of runs.
        run: |
          cd store
          git checkout -q --orphan snapshot
          git add -A
          NEW=$(tail -n1 runs.jsonl | python -c "import json,sys;print(json.load(sys.stdin)['new_reviews'])")
          git commit -qm "data: +$NEW reviews (run ${{ github.run_id }})"
          git push -fq origin snapshot:data
