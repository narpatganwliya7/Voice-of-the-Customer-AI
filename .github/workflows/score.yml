name: Analyse (train, score, insights, AI analyst)

# Fast lane: distils the AI annotations into a local classifier, scores every review and
# builds the SQL insights with no API calls. Deep lane: the AI analyst (free Gemini tier)
# investigates only what the numbers flag.
on:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain the classifier from the latest annotations"
        type: boolean
        default: true
      agent:
        description: "Let the AI analyst investigate spikes, bad releases and top drivers"
        type: boolean
        default: true
      max_cases:
        description: "Max cases for the AI analyst"
        default: "5"

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch keeps the runner light)
        run: |
          pip install -r requirements.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.*" sentence-transformers
      - run: bash scripts/databranch.sh open

      - name: Restore embedding cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: embeddings-${{ github.run_id }}
          restore-keys: embeddings-

      - name: Analyse (train, score, insights, AI analyst)
        run: python -m ecoute score --store store --cache cache ${{ (inputs.retrain || github.event_name != 'workflow_dispatch') && '--retrain' || '' }}

      - name: Keep the embedding cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: embeddings-${{ github.run_id }}

      - name: Build insights
        run: python -m ecoute insights --store store

      - name: AI analyst investigates
        if: ${{ inputs.agent != false }}
        continue-on-error: true   # the free daily quota may be used up; numbers above are still saved
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ecoute agent --store store --max-cases "${{ inputs.max_cases || '5' }}"

      - name: Build website data
        run: python -m ecoute site --store store --out store/site

      - name: Save to the data branch
        run: |
          N=$(python -c "import pandas as pd;print(len(pd.read_parquet('store/scored.parquet')))")
          bash scripts/databranch.sh save "data: $N reviews scored (run ${{ github.run_id }})"
