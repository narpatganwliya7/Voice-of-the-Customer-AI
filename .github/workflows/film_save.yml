name: Save film to the private data store

# After "Render film" succeeds: keeps the LinkedIn copy and a set of review frames in the
# private data store, so the film can be checked frame by frame without downloading artifacts.
on:
  workflow_run:
    workflows: ["Render film"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Render film' run"
        required: true

permissions:
  contents: read   # data is saved to the private store with DATA_TOKEN, not to this repository
  actions: read

concurrency:
  group: data-branch
  cancel-in-progress: false

env:   # the private data store (see scripts/databranch.sh)
  DATA_REPO: ${{ vars.DATA_REPO }}
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}

jobs:
  save:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash scripts/databranch.sh open
      - uses: actions/download-artifact@v4
        with:
          name: ecoute-film
          path: film
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the LinkedIn copy and review frames
        run: |
          mkdir -p store/video/film/frames
          cp film/ecoute_film_linkedin_1080x1350.mp4 store/video/film/
          for t in 2 9 17 23 30 37 44 50 53 56 60 66 71 76; do
            ffmpeg -v error -ss "$t" -i film/ecoute_film_master.mp4 -frames:v 1 -q:v 3 "store/video/film/frames/master_$(printf %02d $t)s.jpg"
          done
          ls -la store/video/film store/video/film/frames
      - name: Save
        run: |
          bash scripts/databranch.sh save "data: film v3 (run ${{ github.event.workflow_run.id || inputs.run_id }})"
